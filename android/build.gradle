allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
buildscript {
    ext.kotlin_version = '1.9.0' // or higher
    repositories {
        google() // Ensure this is included
        mavenCentral()// Optional, depending on your project
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0' // Your Gradle plugin version
        classpath 'com.google.gms:google-services:4.4.2' // Make sure this line is correct
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}



rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}


